  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="assets/styles/themes/default.css" />
  </head>
  <body>
    <div id="login">
      <form id="loginForm" style="text-align: center;">
        <input id="fn" placeholder="First name" type="text"><br>
        <input id="ln" placeholder="Last name" type="text"><br>
        <input id="passwd" placeholder="Password (case sensitive)" type="password"><br>
        <input type="submit">
      </form>
    </div>
    <div id="proxy">
    <div class="fixed-nav-bar" style="display: block">
    <div class="fixed-nav-bar-container">
      <a class="icon" href="/./"><img alt="home" id="INImg" src="/assets/media/favicon/main.png" /></a>
    </div>
    <div class="fixed-nav-bar-right">
      <a class="navbar-link" href="/./g"><i class="fa-solid fa-gamepad navbar-icon"></i>Games</a>
      <a class="navbar-link" href="/./ap"><i class="fa-solid fa-phone navbar-icon"></i>Apps</a>
      <a class="navbar-link" href="/./t"><i class="fa-solid fa-laptop navbar-icon"></i>Tabs</a>
      <a class="navbar-link" href="/./s"><i class="fa-solid fa-gear navbar-icon settings-icon"></i>Settings</a>
    </div>
    </div>
    <div id="particles-js" style="display: block">
      <div class="main">
        <h1 class="title">Hacker Hub</h1>
        <div class="search-container">
          <form id="fs" method="POST" action="/insert-database" autofocus>
            <input id="is" name="is" class="main-search" placeholder="A World, Uncensored" type="text" />
          </form>
        </div>
      </div>
    </div>
    </div>
    <script>
      if ((!(localStorage.getItem('fname')) && !(localStorage.getItem('lname'))) || false) {
        alert('Login has been enabled. For a user named John Doe, they would type John in the first box, and Doe in the second. If you have trouble logging in, rather than clicking submit, click Help. Please use your REAL NAME. When the login system is finished, an incorrect id will cause many problems. To set a password, go to the settings tab. Lying, or providing a name that is not yours may result in a ban.')   
        document.getElementById('proxy').hidden = true
        document.getElementById('loginForm').addEventListener("submit", function() {
          event.preventDefault()
          //First name
          let fn = document.getElementById('fn').value
          fn = fn.toLowerCase()
          fn = fn.charAt(0).toUpperCase() + fn.substring(1)
          //Last name
          let ln = document.getElementById('ln').value
          ln = ln.toLowerCase()
          ln = ln.charAt(0).toUpperCase() + ln.substring(1)
          let passwd = document.getElementById('passwd').value
          //Verification
          let AJAX  = new XMLHttpRequest()
          AJAX.open('GET', '/get-database')
          AJAX.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
              const data = JSON.parse(this.responseText)
              if ((data[fn]['name'] == ln) && data[fn]['password'] == passwd) {
                localStorage.setItem('fname', fn)
                localStorage.setItem('lname', ln)
                location.href = location.href
              } else {
                alert('Error logining in! Contact the developer if the issue continues.')
              }
            }
          }
          AJAX.send()
        })
      } else {
        document.getElementById('login').hidden = true
        document.getElementById('proxy').hidden = false
      }
    </script>
    <script src="assets/scripts/h.js"></script>
    <script type="module" src="assets/scripts/index.js"></script>
